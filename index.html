<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HDR-gainmap toys</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>HDR gain map toys</h1>
  <div id="gpu">starting…</div>
  <div id="status"></div>
  <nav style="margin-left:auto;display:flex;gap:10px;font-size:12px">
    <a href="examples/sdr-canvas-demo.html" style="color:#7fd4ff">SDR→HDR demo</a>
    <a href="examples/hdr-canvas-demo.html" style="color:#7fd4ff">HDR→Save demo</a>
    <a href="examples/galaxy-hdr-capture.html" style="color:#7fd4ff">Galaxy + plugin</a>
    <a href="examples/hdr-selftest.html" style="color:#ffd479">HDR self-test</a>
    <a href="i2HDR_webGPU_example.html" style="color:#8b95a6">simple i2HDR</a>
  </nav>
</header>

<main>
  <section class="stage">
    <div id="drop">
      <strong>drop an image</strong>
      <label class="file">open…<input id="open" type="file" accept="image/*"></label>
      <div id="patterns">
        <button type="button" data-kind="ramp">ramp</button>
        <button type="button" data-kind="sky">sky + sun</button>
        <button type="button" data-kind="steps">steps</button>
      </div>
    </div>

    <div id="viewcol">
      <div id="viewwrap"><canvas id="view"></canvas></div>
      <canvas id="histo" height="110"></canvas>
    </div>
  </section>

  <aside id="controls">
    <canvas id="curve" width="300" height="190"></canvas>
    <div class="saved">
      <h3>saved file (as an &lt;img&gt;)</h3>
      <img id="saved" alt="saved ultra hdr jpeg">
    </div>
  </aside>
</main>

<script src="src/ultrahdr.js"></script>
<script src="src/gpu.js"></script>
<script src="src/shaders.js"></script>
<script src="src/curve.js"></script>
<script src="src/patterns.js"></script>
<script src="src/ui.js"></script>
<script src="src/app.js"></script>
</body>
</html>
